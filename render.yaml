# Render Blueprint — Node/Express backend for Hendy Video Studio VietSub
# Cloudflare Pages serves the public frontend; Render runs the Node.js API and processing routes.
services:
  - type: web
    name: hendy-video-studio-vietsub-api
    runtime: node
    plan: free
    region: singapore
    branch: fix/pages-render-production-2026-10
    buildCommand: npm install --no-audit --no-fund && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ACCESS_ISSUER
        sync: false
      - key: ADMIN_ACCESS_AUD
        sync: false
      - key: ADMIN_ACCESS_EMAILS
        sync: false
      - key: ADMIN_ACCESS_ALLOW_LOCAL_DEV
        value: "false"
      - key: DEDICATED_ADMIN_GATEWAY_SECRET
        sync: false
