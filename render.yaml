# Render.com Infrastructure-as-Code Blueprint
# Production Deployment for https://hendy-video-studio-new-pro.onrender.com/
services:
  - type: web
    name: hendy-video-studio-new-pro
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://hendy-video-studio-new-pro.onrender.com
      - key: ADMIN_GATEWAY_URL
        value: https://hendy-video-studio-new-pro.onrender.com/admin-console/network-gateway
      - key: VITE_APP_NAME
        value: Hendy Vietsub Studio Pro
      - key: VITE_PUBLIC_URL
        value: https://hendy-video-studio-new-pro.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      # Required to protect /admin.html and administrative API namespaces.
      - key: ADMIN_ACCESS_ISSUER
        sync: false
      - key: ADMIN_ACCESS_AUD
        sync: false
      - key: ADMIN_ACCESS_EMAILS
        sync: false
      - key: ADMIN_ACCESS_ALLOW_LOCAL_DEV
        value: "false"
      - key: DEDICATED_ADMIN_GATEWAY_SECRET
        sync: false
