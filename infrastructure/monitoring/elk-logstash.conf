# =============================================================================
# [TẦNG 0] HENDY STUDIO PRO - ELK STACK LOGSTASH PIPELINE
# Path: infrastructure/monitoring/elk-logstash.conf
# =============================================================================
input {
  http {
    port => 5044
    codec => "json"
  }
}

filter {
  mutate {
    add_field => { "architecture_blueprint" => "hendy-studio-pro-7-tier" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hendy-studio-pro-logs-%{+YYYY.MM.dd}"
  }
}
