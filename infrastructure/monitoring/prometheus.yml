# =============================================================================
# [TẦNG 0] HENDY STUDIO PRO - PROMETHEUS & GRAFANA SCRAPE CONFIGURATION
# Path: infrastructure/monitoring/prometheus.yml
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "tier0-admin-control-plane"
    static_configs:
      - targets: ["admin.hendystudio.net:8443", "10.240.0.10:8443"]

  - job_name: "tier1-studio-web-render"
    metrics_path: "/api/admin-control-plane/monitoring"
    static_configs:
      - targets: ["hendy-video-studio-new-pro.onrender.com:443"]

  - job_name: "tier4-ktor-coroutines-engine"
    static_configs:
      - targets: ["ktor-engine:8080"]

  - job_name: "tier5-ai-worker-bullmq"
    static_configs:
      - targets: ["ai-worker:9100"]
