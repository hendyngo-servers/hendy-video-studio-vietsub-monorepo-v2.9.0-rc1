name: Validate platform v3 rewrite foundation

on:
  push:
    branches: [rewrite/dual-cloudflare-render-v3]
    paths:
      - "platform-v3/**"
      - ".github/workflows/platform-v3.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform-v3/**"
      - ".github/workflows/platform-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform-v3/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check src/server.mjs
      - run: npm test
