name: CI and Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Run Cloudflare/admin security tests
        run: npm run check:cloudflare
      - name: Validate Cloudflare Pages Function syntax
        run: |
          node --check 'functions/api/[[path]].js'
          node --check functions/health.js
      - name: Build public frontend for Pages
        run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/apps/studio-web/index.html
          test ! -f dist/admin.html

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Build public frontend for Pages
        run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy frontend and Pages Functions (not root Node server)
        run: npx --yes wrangler@4.149.0 pages deploy dist --config wrangler.toml --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production Pages health proxy
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://hendy-vietsub-pro.pages.dev/health
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://hendy-vietsub-pro.pages.dev/api/health
