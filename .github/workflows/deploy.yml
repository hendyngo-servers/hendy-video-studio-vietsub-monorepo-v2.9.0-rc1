name: CI and Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app and deployment targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Check Cloudflare/admin security tests
        run: npm run check:cloudflare
      - name: Check Pages Function syntax
        run: |
          node --check 'functions/api/[[path]].js'
          node --check functions/health.js
      - name: Build static frontend for Cloudflare Pages
        run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Assert Pages output is public-only
        run: |
          test -f dist/index.html
          test -f dist/apps/studio-web/index.html
          test ! -f dist/admin.html
      - name: Build origin app bundle for Render
        run: npm run build:render
        env:
          NODE_ENV: production
      - name: Assert Render build output
        run: |
          test -f dist/index.html
          test -f dist/admin.html
          test -f dist/apps/studio-web/index.html

  deploy-pages:
    name: Deploy Cloudflare Pages production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://hendy-vietsub-pro.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Build public frontend
        run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Verify deployment credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing environment secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing environment secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler@4.149.0 pages deploy dist --config wrangler.toml --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Pages and Render health proxy
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://hendy-vietsub-pro.pages.dev/
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://hendy-vietsub-pro.pages.dev/health
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://hendy-vietsub-pro.pages.dev/api/health
