name: CI and Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run Cloudflare/admin security tests
        run: npm run check:cloudflare
      - name: Build public frontend for Pages
        run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/apps/studio-web/index.html
          test ! -f dist/admin.html

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build:pages
        env:
          NODE_ENV: production
      - name: Deploy frontend to Cloudflare Pages (not Workers bundle)
        run: npx --yes wrangler@4.149.0 pages deploy dist --project-name=hendy-vietsub-pro --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
